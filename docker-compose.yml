version: "3.8"

services:
  api:
    build: .
    ports:
      - "8000:8000"
    environment:
      - OPENAI_API_KEY=${OPENAI_API_KEY}
      - OPENAI_FINANCE_MODEL=${OPENAI_FINANCE_MODEL:-gpt-4o-mini}
    command: uvicorn src.api.main:app --host 0.0.0.0 --port 8000
    restart: unless-stopped

  ui:
    build: .
    ports:
      - "8501:8501"
    environment:
      - OPENAI_API_KEY=${OPENAI_API_KEY}
      - OPENAI_FINANCE_MODEL=${OPENAI_FINANCE_MODEL:-gpt-4o-mini}
    command: streamlit run src/web_app/app.py --server.port 8501 --server.address 0.0.0.0
    restart: unless-stopped
